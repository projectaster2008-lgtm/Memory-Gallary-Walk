<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#spaceGrad)" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="42" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Orbit Rings -->
  <ellipse cx="64" cy="64" rx="46" ry="20" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 4" transform="rotate(-28 64 64)" />
  <ellipse cx="64" cy="64" rx="44" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" transform="rotate(35 64 64)" />

  <!-- Core Glowing 3D Memory Sphere -->
  <circle cx="64" cy="64" r="26" fill="url(#orbGlow)" filter="url(#glow)" />
  <circle cx="64" cy="64" r="26" fill="url(#orbGlow)" opacity="0.9" />
  
  <!-- Sphere Highlight & Depth -->
  <circle cx="56" cy="54" r="10" fill="#ffffff" opacity="0.4" filter="url(#glow)" />
  
  <!-- Floating Memory Card Node Markers -->
  <rect x="24" y="36" width="10" height="13" rx="2" fill="#ffffff" opacity="0.85" transform="rotate(-15 29 42)" filter="url(#glow)" />
  <rect x="94" y="44" width="11" height="14" rx="2" fill="#38bdf8" opacity="0.9" transform="rotate(20 99 51)" filter="url(#glow)" />
  <rect x="68" y="90" width="12" height="15" rx="2" fill="#34d399" opacity="0.9" transform="rotate(-10 74 97)" filter="url(#glow)" />
  
  <!-- Center Star Shimmer -->
  <path d="M64 48 L66.5 59.5 L78 62 L66.5 64.5 L64 76 L61.5 64.5 L50 62 L61.5 59.5 Z" fill="#ffffff" opacity="0.95" />
</svg>
